name = "typecho-work"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Runtime-installed theme assets and uploads are served by the Worker before static fallback.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/usr/themes/*", "/usr/uploads/*"]

[dev]
port = 8787

[[d1_databases]]
binding = "DB"
database_name = "typecho"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "typecho-files"

[observability]
enabled = true
